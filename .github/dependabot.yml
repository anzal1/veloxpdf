version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      npm-all:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions-all:
        patterns: ["*"]
