name: Studio demo (GitHub Pages)

# The Studio runs entirely in the visitor's browser (public/ is static: the page,
# the browser engine bundle, presets.json and the PDF/A fonts), so Pages can host it.
on:
  push:
    branches: [main]
    paths: ['public/**', 'src/**', 'scripts/build-browser.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
